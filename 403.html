<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/img/favicon-96x96.png" rel="icon" sizes="96x96" type="image/png">
    <title>403 — UKRAINE RP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0f;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .scanlines {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(232,60,60,0.02) 2px,
                rgba(232,60,60,0.02) 4px
            );
            pointer-events: none;
            z-index: 1;
            animation: scan-move 8s linear infinite;
        }
        @keyframes scan-move {
            from { background-position: 0 0; }
            to { background-position: 0 100px; }
        }

        .border-pulse {
            position: fixed;
            inset: 0;
            border: 2px solid transparent;
            border-radius: 0;
            animation: border-glow 3s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes border-glow {
            0%, 100% { border-color: transparent; }
            50% { border-color: rgba(220, 60, 60, 0.2); }
        }

        .glow-orb {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(220,60,60,0.12) 0%, transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse-orb 4s ease-in-out infinite;
            z-index: 0;
        }
        @keyframes pulse-orb {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        .logo {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            filter: drop-shadow(0 0 12px rgba(220,60,60,0.3));
            z-index: 10;
            animation: logo-fade 1s ease-out;
        }
        @keyframes logo-fade {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 1000px;
            padding: 40px;
            position: relative;
            z-index: 2;
        }

        .code-block {
            flex: 1 1 280px;
            font-size: 10rem;
            font-weight: 900;
            text-align: center;
            line-height: 1;
            background: linear-gradient(135deg, #dc3c3c, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: code-enter 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
            position: relative;
        }
        @keyframes code-enter {
            from { opacity: 0; transform: translateY(40px) scale(0.8); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .lock-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            opacity: 0.12;
            animation: lock-shake 2s ease-in-out infinite;
        }
        @keyframes lock-shake {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            25% { transform: translate(-50%, -50%) rotate(-3deg); }
            75% { transform: translate(-50%, -50%) rotate(3deg); }
        }

        .text-block {
            flex: 1 1 380px;
            padding: 30px;
            animation: text-enter 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
        }
        @keyframes text-enter {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .text-block h1 {
            font-size: 2.2rem;
            margin-bottom: 12px;
            color: #f5f5f5;
            font-weight: 700;
        }
        .text-block p {
            font-size: 1.1rem;
            color: #999;
            line-height: 1.7;
            max-width: 440px;
        }

        .btn-home {
            display: inline-block;
            margin-top: 24px;
            padding: 12px 28px;
            background: linear-gradient(135deg, #dc3c3c, #b02e2e);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 50px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(220,60,60,0.3);
        }
        .btn-home:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 30px rgba(220,60,60,0.5);
        }
        .btn-home:active {
            transform: translateY(0) scale(0.98);
        }

        @media (max-width: 768px) {
            .code-block { font-size: 7rem; }
            .text-block h1 { font-size: 1.6rem; }
            .text-block p { font-size: 0.95rem; }
            .logo { width: 120px; top: 30px; }
            .glow-orb { width: 220px; height: 220px; }
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="border-pulse"></div>
    <div class="glow-orb"></div>

    <img src="/img/logoserver.png" class="logo" alt="UKRAINE RP Logo">

    <div class="container">
        <div class="code-block">
            403
            <div class="lock-icon">🔒</div>
        </div>
        <div class="text-block">
            <h1>Доступ заборонено</h1>
            <p>У вас немає дозволу на перегляд цієї сторінки.<br>Якщо це помилка — зверніться до адміністрації.</p>
            <a href="/" class="btn-home">← На головну</a>
        </div>
    </div>
</body>
</html>
